version: 2
updates:
  # Actions pinned by SHA (with the version in a comment) in every workflow of .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
  # Hook versions of the default pre-commit config (.github/configs). Keep odoo-addons-template in sync.
  - package-ecosystem: "pre-commit"
    directory: "/.github/configs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
